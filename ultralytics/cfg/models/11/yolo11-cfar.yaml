# CFAR-YOLOv11: Resource-optimised dark-vessel detector for polarimetric SAR imagery.
# Novel components (see ultralytics/nn/modules/cfar.py and research/README.md):
#   RobustCFARGate — differentiable truncated-statistics CFAR attention with learnable per-channel threshold.
#     Placed (a) on early P2/4 features, where activations still track SAR backscatter statistics, to suppress
#     sea clutter and speckle before deep feature extraction, and (b) on the P3/8 head branch to sharpen the
#     small-vessel detection path. Adds 3 params/channel, zero convolutions.
#   C3k2DCA — Dense Context-Aware C3k2 (successor of the proposal's modified C2f): multi-dilation depthwise
#     pyramid + global-context channel gate for separating small vessels from near-shore clutter. Used in the
#     high-resolution backbone stages (P2, P3) and the P3 head branch where small-ship evidence lives.
# Recommended scales for the resource-optimised setting: n (default) and s.
# Usage: YOLO('yolo11n-cfar.yaml')

# Parameters
nc: 1 # number of classes (ship)
scales: # model compound scaling constants, i.e. 'model=yolo11n-cfar.yaml' will call yolo11-cfar.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# CFAR-YOLOv11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RobustCFARGate, [11, 5]] # 2 (clutter suppression on early features)
  - [-1, 2, C3k2DCA, [256, False, 0.25]] # 3 (dense context-aware, P2)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2DCA, [512, False, 0.25]] # 5 (dense context-aware, P3)
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# CFAR-YOLOv11 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2DCA, [256, False]] # 17 (dense context-aware, small-vessel path)
  - [-1, 1, RobustCFARGate, [11, 5]] # 18 (CFAR-refined P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, Concat, [1]] # 20 cat head P4
  - [-1, 2, C3k2, [512, False]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 11], 1, Concat, [1]] # 23 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
